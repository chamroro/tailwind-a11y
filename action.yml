# Manifest for the GitHub Action adapter. Lives at the repo root so consumers
# can write `uses: chamroro/tailwind-a11y@v0`; the implementation is in
# packages/github-action-tailwind-a11y (see that package's README).
name: "tailwind-a11y"
description: >-
  Catches Tailwind CSS accessibility violations (contrast, touch targets,
  focus) as inline PR annotations.
author: "chamroro"
branding:
  icon: "eye"
  color: "blue"

inputs:
  patterns:
    description: >-
      Whitespace- or newline-separated glob pattern(s) for files to scan.
    required: false
    default: "**/*.{jsx,tsx}"
  config:
    description: >-
      Path to a tailwind.config.js/.cjs to read custom theme colors/spacing
      from. Defaults to auto-detecting one in the repository root.
    required: false
    default: ""
  fail-on-violations:
    description: >-
      Fail the job (exit 1) when violations are found. Set to "false" to
      report annotations without failing.
    required: false
    default: "true"
  strict:
    description: >-
      Enforce WCAG 2.5.5 (AAA, 44x44px) touch targets instead of the default
      2.5.8 (AA, 24x24px), WCAG 2.4.13's minimum focus-indicator thickness
      alongside the always-on 1.4.11 (AA) contrast check, and the
      reduced-motion check (WCAG 2.3.3, AAA-only, off by default).
    required: false
    default: "false"

runs:
  using: "node24"
  main: "packages/github-action-tailwind-a11y/dist/index.js"
