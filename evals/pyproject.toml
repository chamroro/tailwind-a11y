[project]
name = "a11y-evals"
version = "0.1.0"
description = "Measures what the mcp-tailwind-a11y tool changes in the UI code a coding agent writes, and what it cannot show."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Installed only for the live runs (stage 2); the harness and its tests need no AWS.
strands = ["strands-agents>=1.65.0"]

[project.scripts]
a11y-evals = "a11y_evals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["a11y_evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
