# Development split: prompts, arm wording and the tool's instructions may be tuned against these.
# They are never used for the reported comparison. Tasks in test.yaml are frozen before a run.
# `requires` counts JSX written in the source, not elements rendered (a .map() or a reusable component renders many
# from one), so every minimum is 1: it asks only that each kind of element the task needs is written at least once.
tasks:
  - id: dev-pricing-card
    stratum: natural
    prompt: >-
      Build a pricing card for a SaaS product. It shows a plan name, a monthly price,
      a short list of what is included (a ul with li items), and a button to choose the plan.
    requires:
      - { tag: button, min: 1 }
      - { tag: li, min: 1 }

  - id: dev-login-form
    stratum: natural
    prompt: >-
      Build a login form with an email field, a password field, a "remember me" checkbox,
      a submit button, and a small "forgot password" link.
    requires:
      - { tag: input, min: 1 }
      - { tag: button, min: 1 }
      - { tag: a, min: 1 }

  - id: dev-status-badges
    stratum: natural
    prompt: >-
      Build a list of status badges for a deployment dashboard (a ul with li items): success, warning,
      error, pending and cancelled. Each badge has a coloured dot and a label.
    requires:
      - { tag: li, min: 1 }

  - id: dev-card-grid-control
    stratum: control
    prompt: >-
      Build a responsive three-column grid of empty placeholder boxes that keep their shape
      as the screen gets narrower. The boxes only need a border and some spacing.
    requires:
      - { tag: div, min: 1 }
